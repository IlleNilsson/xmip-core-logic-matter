# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-logic-matter"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-logic-matter"
description = "Matter logic technology: an endpoint, cluster and command path in a TLV invoke request becomes a named operation with TLV arguments, and a result or status becomes an invoke response again. A xmip-core-logic technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
logic = { package = "xmip-core-logic", git = "https://github.com/IlleNilsson/xmip-core-logic", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
# The estate's encoding primitives: the byte cursor Matter TLV is read over.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[dev-dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
